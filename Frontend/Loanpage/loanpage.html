<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Apply Loan</title>

<link rel="stylesheet" href="loanpage.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

</head>

<body>

<div class="container">

<h1>Loan Application Form</h1>

<form id="loanForm">

<div class="row">

<div class="inputBox">

<label>Customer ID</label>

<input
type="text"
id="customerId"
required>

</div>

<div class="inputBox">

<label>Full Name</label>

<input
type="text"
id="customerName"
required>

</div>

</div>

<div class="row">

<div class="inputBox">

<label>Loan Type</label>

<select id="loanType">

<option>Personal Loan</option>

<option>Home Loan</option>

<option>Car Loan</option>

<option>Education Loan</option>

<option>Business Loan</option>

<option>Gold Loan</option>

</select>

</div>

<div class="inputBox">

<label>Loan Amount</label>

<input
type="number"
id="loanAmount"
required>

</div>

</div>

<div class="row">

<div class="inputBox">

<label>Monthly Income</label>

<input
type="number"
id="income">

</div>

<div class="inputBox">

<label>Employment</label>

<select id="employment">

<option>Salaried</option>

<option>Self Employed</option>

<option>Business</option>

</select>

</div>

</div>

<div class="row">

<div class="inputBox">

<label>Credit Score</label>

<input
type="number"
id="creditScore">

</div>

<div class="inputBox">

<label>Loan Tenure</label>

<select id="tenure">

<option>12 Months</option>

<option>24 Months</option>

<option>36 Months</option>

<option>48 Months</option>

<option>60 Months</option>

</select>

</div>

</div>

<div class="row">

<div class="inputBox">

<label>PAN Card</label>

<input type="file">

</div>

<div class="inputBox">

<label>Aadhaar Card</label>

<input type="file">

</div>

</div>

<div class="row">

<div class="inputBox">

<label>Salary Slip</label>

<input type="file">

</div>

<div class="inputBox">

<label>Bank Statement</label>

<input type="file">

</div>

</div>

<div class="buttons">

<button
type="button"
onclick="checkEligibility()">

Check Eligibility

</button>

<button
type="button"
onclick="calculateEMI()">

Calculate EMI

</button>

<button
type="submit">

Submit Application

</button>

</div>

</form>

<div class="result">

<h2>Eligibility Result</h2>

<p id="eligibility"></p>

<p id="emi"></p>

</div>

</div>

<script src="loanpage.js"></script>

</body>
</html>
